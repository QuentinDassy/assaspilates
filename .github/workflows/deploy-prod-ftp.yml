name: Deploy prod (SFTP)

# OVH's native Git deploy (used for the `test` subdomain, see
# sync-ovh-deploy.yml) only has one slot configured on this hosting plan's
# Multisite panel, and the "Configurer Git" option isn't available for the
# assas-pilates-ballet.com row -- so the `prod/` folder is synced over SFTP
# instead (OVH's FTP server rejected explicit FTPS with "security scheme
# not implemented", but SFTP on port 22 is natively supported). lftp mirror
# only uploads/updates -- it never deletes remote-only files -- so
# site/api/_lib/config.php (server-only secret, gitignored, never present
# in this checkout) is never touched.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        # The runner image carries third-party apt sources (Google Chrome)
        # whose index intermittently fails its hash check, and `apt-get
        # update` then exits 100 and takes the whole deploy down with it --
        # even though Ubuntu's own lists, the only ones lftp needs, fetched
        # fine. Drop those sources and judge the step on the install itself.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update || echo "apt-get update reported errors, continuing to the install"
          sudo apt-get install -y lftp

      - name: Mirror site/ to prod/ over SFTP
        env:
          FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          FTP_SERVER=$(printf '%s' "$FTP_SERVER" | tr -d '\r\n')
          FTP_USERNAME=$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n')
          FTP_PASSWORD=$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')
          # Pre-join user,pass in plain bash (no embedded quotes) so lftp's
          # own script parser never sees a quote character inside -u's value
          # -- that's what corrupted the username in earlier attempts.
          USERPASS="$FTP_USERNAME,$FTP_PASSWORD"
          lftp -e "
            set sftp:auto-confirm yes;
            set net:timeout 15;
            set net:max-retries 3;
            open -u $USERPASS sftp://$FTP_SERVER;
            pwd;
            mirror --reverse --verbose \
              --exclude-glob config.php \
              --exclude-glob jwks_cache.json \
              ./site/ prod/;
            bye
          "
